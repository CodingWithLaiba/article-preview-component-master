<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Article preview component</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
  </head>
  <body>
    <section class="Article">
      <div class="image">
        <img src="images/drawers.jpg" alt="drawers" width="300px" />
      </div>
      <div class="content">
        <p class="intro">
          Shift the overall look and feel free by adding these wonderful touches
          to furniture your home
        </p>
        <p class="description">
          Ever been in a room and felt like something is missing?<br />Perhaps
          it felt slightly bare and uninviting.I've got some simple tips to help
          you make any room feel complete.
        </p>
        <section class="details">
        <div class="author">
          <div class="avatar">
            <img src="images/avatar-michelle.jpg" alt="">
          </div>
          <div class="infromation">
            <p class="name">Michelle Appleton</p>
            <p class="date">28 Jun 2022</p>
          </div>
        </div>
        <div class="share">
          <img src="images/icon-share.svg" alt="share">
        </div>
        </section>
      </div>
    </section>

    <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
  </body>
</html>
